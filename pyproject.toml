[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-planner"
version = "0.1.0"
description = "Plans and audits filesystem migrations; never mutates migration files itself."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
migrator = "migrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_jev: talks to the real OpenRouter Decisions API (needs OPENROUTER_API_KEY)",
    "postgres: needs a PostgreSQL server",
]
addopts = "-m 'not live_jev'"
